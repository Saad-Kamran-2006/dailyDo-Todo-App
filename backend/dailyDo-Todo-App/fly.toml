# fly.toml app configuration file generated for dailydo-todo-app
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "dailydo-todo-backend" # User may need to change this to a unique name
primary_region = "sin" # Singapore

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  PYTHON_VERSION = "3.12.0"
  # DATABASE_URL and SECRET_KEY should be set via Fly.io Secrets Management
